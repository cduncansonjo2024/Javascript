<!DOCTYPE html>
<html>
<head>
  <title>JavaScript </title>
    <meta charset="UTF=8">
    <meta name="viewport" content="width=device-width,inital-scale=1.0">
</head> <!--Remember to close your tags-->


<body>
<h1>Simple Javascript Page </h1>
<p id="message"> Click button below!</p>
<button id="myBtn"> Try It Out</button>


<script>
const button = document.getElementById("myBtn");
const message = document.getElementById("message");
        button.addEventListener("click", function() {  //event listeners
            console.log("Button clicked!");      // logs the button click
            if (message.innerText === "") {       //looks for the paragraph content
                message.innerText = "My Name is Chrissy Duncanson";
            } else {
                message.innerText = "";
            }
        });
</script>
</body>


</html>
